name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  # Supersede stale PR runs only; every push to main runs to completion so its
  # result is recorded for that commit (release.yml checks it before building).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Quality Checks
    permissions:
      contents: read
    uses: ./.github/workflows/ci-checks.yml
