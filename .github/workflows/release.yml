# Production release: signed macOS + Windows desktop artifacts and a draft GitHub
# release, cut from a `v*` tag.
#
# Both platform builds enable the `sync` cargo feature (`-f sync`), so shipped
# releases INCLUDE end-to-end encrypted sync. That needs three extras, each mirrored
# verbatim from the proven sync-test-build.yml invocation (keep the two workflows in
# step): the pinned nightly-2023-10-05 toolchain for the vendored cr-sqlite bundle,
# CARGO_PROFILE_RELEASE_LTO=false, and — on Windows only — /FORCE:MULTIPLE on the app
# link. Each is commented at its step.
#
# sync-test-build.yml still exists for on-demand test artifacts from an arbitrary ref;
# it does not create releases.

name: Release

on:
  push:
    tags: ['v*']
  # Canary builds: dispatching on a branch runs ONLY build-windows and
  # uploads the NSIS/updater artifacts to the run — no release is created
  # and build-macos (signing/notarization) is skipped. Used to hand the
  # Windows canary machine an installer without cutting a release.
  workflow_dispatch:

# Minimal top-level permissions — jobs elevate as needed
permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Required by the `-f sync` build. The root [profile.release] uses lto="thin", but the
  # vendored cr-sqlite static bundle is compiled by the pinned nightly-2023-10-05 rustc —
  # its objects lack a bitcode section the host rustc's thin-LTO expects ("failed to get
  # bitcode from object file for LTO / Can't find section __bitcode"), so a thin-LTO link
  # hard-fails. Overriding the profile here (not in Cargo.toml) keeps local/dev builds
  # untouched. Cost is size/perf only. Same override as sync-test-build.yml.
  CARGO_PROFILE_RELEASE_LTO: "false"

jobs:
  build-macos:
    name: Build macOS
    # Tag pushes only — a workflow_dispatch canary run needs just the
    # Windows artifact; skipping macOS avoids a wasted sign+notarize pass.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    environment: release
    permissions:
      contents: read
    env:
      APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install cmake
        run: brew install cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Install pinned nightly for the vendored cr-sqlite bundle
        # Required by the `-f sync` build: crates/yapstack-sync/build.rs nested-builds
        # vendor/cr-sqlite/core/rs/bundle_static, whose rust-toolchain.toml pins
        # nightly-2023-10-05 (channel only, no components) — installing the toolchain is
        # all the runner needs.
        run: rustup toolchain install nightly-2023-10-05 --profile minimal

      - name: Xcode fingerprint for cache key
        # Same rationale as ci-checks.yml: caches embed absolute Xcode
        # toolchain paths; key by Xcode version so mixed runner images
        # can't poison relinks.
        id: xcode
        # The marketing version ("Xcode 16.4") is not precise enough: two
        # images can share it while shipping different clang majors, and the
        # clang RESOURCE DIR is the exact absolute path cached build-script
        # output goes stale against. Fingerprint that path directly.
        run: echo "version=$(xcodebuild -version | head -1 | tr ' ' '-')-$(xcrun clang --print-resource-dir | shasum -a 256 | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: release-macos
          key: ${{ steps.xcode.outputs.version }}
          cache-directories: ~/Library/Caches/ort.pyke.io

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build sidecars
        env:
          SOURCE_DATE_EPOCH: "1"
        run: ./scripts/build-sidecars.sh

      - name: Import code signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm certificate.p12

      - name: Build Tauri app (--features sync, signed + notarized)
        # `-f sync` forwards the cargo feature to the app crate
        # (apps/desktop/src-tauri/Cargo.toml [features] sync) so the release ships
        # end-to-end encrypted sync. Command form is byte-for-byte the proven
        # sync-test-build.yml signed invocation (pnpm --filter from the repo root, no
        # working-directory) — the bundle paths below are repo-root relative either way.
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @yapstack/desktop tauri build --target aarch64-apple-darwin -f sync

      - name: Generate checksum
        run: |
          cd target/aarch64-apple-darwin/release/bundle/dmg
          shasum -a 256 *.dmg > checksums-macos.txt
          cat checksums-macos.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-dmg
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/dmg/checksums-macos.txt

      - name: Upload updater artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-updater
          path: |
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
    env:
      APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
      # Mapped at job level (not on the signing step) so its `if:` can read it:
      # GitHub evaluates a step's `if:` BEFORE applying that step's own `env:`.
      WINDOWS_SIGN_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check cmake
        # windows-latest ships cmake in the runner image; the sidecar's
        # whisper-rs / parakeet-rs cmake builds use it. Echo the version so
        # runner-image updates that break the build are diagnosable.
        run: cmake --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install pinned nightly for the vendored cr-sqlite bundle
        # Required by the `-f sync` build — same rationale as the macOS job: the
        # vendored cr-sqlite static bundle pins nightly-2023-10-05 (channel only).
        run: rustup toolchain install nightly-2023-10-05 --profile minimal

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          shared-key: release-windows
          # ort-sys downloads its prebuilt binaries here at build-script time;
          # cache it so builds don't depend on cdn.pyke.io availability.
          cache-directories: ~/AppData/Local/ort.pyke.io

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build sidecars
        # Pass the Windows target explicitly so the build script's Windows
        # branch runs (features: whisper,parakeet) and emits the
        # target-triple-suffixed exe that Tauri's externalBin requires:
        # binaries/yapstack-transcription-sidecar-x86_64-pc-windows-msvc.exe
        shell: bash
        env:
          SOURCE_DATE_EPOCH: "1"
        run: ./scripts/build-sidecars.sh x86_64-pc-windows-msvc

      # TODO(T005): Authenticode signing — needs a WINDOWS_CERTIFICATE secret
      # that does NOT exist yet. Until it is wired, this job produces an
      # UNSIGNED NSIS installer (SmartScreen will warn on first run). The step
      # below is a clearly-marked, skippable placeholder: it is a no-op today
      # and only runs once WINDOWS_SIGN_CERT is populated. Do not invent a
      # secret value here — routes to T005 (Authenticode signing secret).
      - name: Import Windows code signing certificate (gated — T005)
        # WINDOWS_SIGN_CERT is mapped at JOB level, not here: a step's `if:` is
        # evaluated before that same step's `env:`, so mapping it here would
        # leave this condition permanently false. Do not move it back.
        if: ${{ env.WINDOWS_SIGN_CERT != '' }}
        run: |
          echo "Authenticode signing is gated on the WINDOWS_CERTIFICATE secret (T005)."
          echo "This step is a placeholder and is skipped until that secret is wired."

      - name: Build Tauri app (--features sync)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Required by the `-f sync` app link ONLY (the sidecar step above must NOT set
          # it): the vendored cr-sqlite no_std bundle (crsql_bundle) defines its own
          # `rust_eh_personality`, which collides with libstd's on the MSVC linker
          # (LNK2005 -> LNK1169). Both definitions are equivalent no-ops under
          # panic="abort" (this repo's release profile), so first-wins is safe.
          RUSTFLAGS: "-Clink-arg=/FORCE:MULTIPLE"
        # Restrict to NSIS: tauri.conf.json bundle.targets is "all", but on
        # Windows that also builds MSI/WiX, which hard-fails on the non-numeric
        # pre-release version (tauri-bundler rejects "1.0.0-alpha.NN" for MSI).
        # Updater artifacts (*.nsis.zip[.sig]) come from createUpdaterArtifacts
        # in tauri.conf.json and are emitted alongside the nsis bundle.
        #
        # `-f sync` ships end-to-end encrypted sync in the release. Command form is
        # byte-for-byte the proven sync-test-build.yml Windows invocation.
        run: pnpm --filter @yapstack/desktop tauri build --target x86_64-pc-windows-msvc --bundles nsis -f sync

      - name: Generate checksum
        shell: bash
        run: |
          cd target/x86_64-pc-windows-msvc/release/bundle/nsis
          sha256sum *-setup.exe > checksums-windows.txt
          cat checksums-windows.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-nsis
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/checksums-windows.txt

      - name: Upload updater artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-updater
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.nsis.zip
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.nsis.zip.sig

  create-release:
    name: Create Release
    # Tag pushes only — canary workflow_dispatch runs produce artifacts,
    # never a release.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-dmg
          path: artifacts/macos

      - name: Download macOS updater artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-updater
          path: artifacts/macos-updater

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-nsis
          path: artifacts/windows

      - name: Download Windows updater artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-updater
          path: artifacts/windows-updater

      - name: Combine checksums
        run: |
          cat artifacts/macos/checksums-macos.txt > checksums-sha256.txt
          cat artifacts/windows/checksums-windows.txt >> checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Generate latest.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          REPO="${GITHUB_REPOSITORY}"

          # Read signatures
          MACOS_SIG=$(cat artifacts/macos-updater/*.app.tar.gz.sig)
          WINDOWS_SIG=$(cat artifacts/windows-updater/*-setup.nsis.zip.sig)

          # Get filenames
          MACOS_FILE=$(basename artifacts/macos-updater/*.app.tar.gz)
          WINDOWS_FILE=$(basename artifacts/windows-updater/*-setup.nsis.zip)

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "See the release notes on GitHub for details.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MACOS_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/${MACOS_FILE}"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/${WINDOWS_FILE}"
              }
            }
          }
          EOF
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/macos/*.dmg
            artifacts/macos-updater/*.app.tar.gz
            artifacts/macos-updater/*.app.tar.gz.sig
            artifacts/windows/*-setup.exe
            artifacts/windows-updater/*-setup.nsis.zip
            artifacts/windows-updater/*-setup.nsis.zip.sig
            latest.json
            checksums-sha256.txt
