name: CI Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  rust:
    name: Rust (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: clippy

      - name: Xcode fingerprint for cache key
        # Cached build-script output embeds absolute toolchain paths (e.g.
        # objc2-exception-helper's clang_rt.osx search dir). macos-latest
        # serves mixed images, so a cache saved under one Xcode breaks
        # relinks under another ("library 'clang_rt.osx' not found").
        # Keying the cache by Xcode version keeps caches image-consistent.
        id: xcode
        # The marketing version ("Xcode 16.4") is not precise enough: two
        # images can share it while shipping different clang majors, and the
        # clang RESOURCE DIR is the exact absolute path cached build-script
        # output goes stale against. Fingerprint that path directly.
        run: echo "version=$(xcodebuild -version | head -1 | tr ' ' '-')-$(xcrun clang --print-resource-dir | shasum -a 256 | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci-macos-latest
          key: ${{ steps.xcode.outputs.version }}
          # ort-sys downloads its prebuilt binaries here at build-script time;
          # cache it so a fingerprint-skipped build script still has its libs.
          cache-directories: ~/Library/Caches/ort.pyke.io

      - name: Create sidecar + framework placeholders
        # tauri.conf.json declares an externalBin (sidecar) and a
        # macOS framework dylib (libwebgpu_dawn.dylib for parakeet-rs's
        # WebGPU EP). The Tauri build script validates both paths
        # exist before linking. Locally `scripts/build-transcription-sidecar.sh`
        # copies them from target/<triple>/<profile>/; in CI we just
        # need the files to exist so cargo check / clippy / test pass.
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          touch apps/desktop/src-tauri/binaries/yapstack-transcription-sidecar-aarch64-apple-darwin
          touch apps/desktop/src-tauri/binaries/libwebgpu_dawn.dylib

      - name: Clippy
        run: cargo clippy --all -- -D warnings

      - name: Run tests
        run: cargo test --all

  rust-sync:
    name: Rust sync feature (macos-latest)
    # `cargo test --all` above builds the desktop crate without its `sync` feature, so the
    # desktop-side sync guards (migration runner on a CRR DB, CreateSyncTable, the drain's
    # boot heal, lane status) only run here. Release builds use `-f sync`.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: clippy

      - name: Install pinned nightly for the vendored cr-sqlite bundle
        # crates/yapstack-sync/build.rs builds vendor/cr-sqlite/.../bundle_static, whose
        # rust-toolchain.toml pins nightly-2023-10-05 (channel only, no components). Same
        # step as sync-test-build.yml and release.yml.
        run: rustup toolchain install nightly-2023-10-05 --profile minimal

      - name: Xcode fingerprint for cache key
        # See the Rust (macos-latest) job.
        id: xcode
        run: echo "version=$(xcodebuild -version | head -1 | tr ' ' '-')-$(xcrun clang --print-resource-dir | shasum -a 256 | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci-macos-latest-sync
          key: ${{ steps.xcode.outputs.version }}
          cache-directories: ~/Library/Caches/ort.pyke.io

      - name: Create sidecar + framework placeholders
        # See the Rust (macos-latest) job: the Tauri build script only checks they exist.
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          touch apps/desktop/src-tauri/binaries/yapstack-transcription-sidecar-aarch64-apple-darwin
          touch apps/desktop/src-tauri/binaries/libwebgpu_dawn.dylib

      - name: Clippy (desktop, sync)
        run: cargo clippy -p yapstack-desktop --features sync --all-targets -- -D warnings

      - name: Run tests (desktop, sync)
        run: cargo test -p yapstack-desktop --features sync

  rust-fluidaudio:
    name: Rust fluidaudio feature (macos-26)
    # The sidecar's `fluidaudio` feature (ADR 0008) builds a Swift package
    # from build.rs, so it needs Swift 6.2+ and is only built on Apple
    # silicon. The other macOS jobs never enable it.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Pinned rather than the image default, so a runner-image Xcode bump
      # can't change the Swift toolchain under the build.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: clippy

      - name: Xcode fingerprint for cache key
        # See the Rust (macos-latest) job.
        id: xcode
        run: |
          xcodebuild -version
          swift --version
          echo "version=$(xcodebuild -version | head -1 | tr ' ' '-')-$(xcrun clang --print-resource-dir | shasum -a 256 | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci-macos-26-fluidaudio
          key: ${{ steps.xcode.outputs.version }}
          cache-directories: ~/Library/Caches/ort.pyke.io

      - name: SwiftPM cache
        # The FluidAudio checkout and its binary artifacts, keyed by the
        # pinned versions in Package.resolved.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: swiftpm-${{ steps.xcode.outputs.version }}-${{ hashFiles('crates/yapstack-transcription-sidecar/swift/YapFluidAudio/Package.resolved') }}

      - name: Clippy (sidecar, fluidaudio)
        run: cargo clippy -p yapstack-transcription-sidecar --features webgpu,fluidaudio --all-targets -- -D warnings

      - name: Run tests (sidecar, fluidaudio)
        run: cargo test -p yapstack-transcription-sidecar --features webgpu,fluidaudio

      - name: Assert the sidecar targets macOS 14
        # build.rs links the Swift code for macOS 14.0 (FluidAudio's floor).
        run: |
          minos=$(otool -l target/debug/yapstack-transcription-sidecar | awk '/LC_BUILD_VERSION/ {b=1} b && $1 == "minos" {print $2; exit}')
          echo "minos $minos"
          [ "$minos" = "14.0" ]

  rust-windows:
    name: Rust (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ci-windows-latest
          # ort-sys downloads its prebuilt binaries here at build-script time;
          # cache it so a fingerprint-skipped build script still has its libs.
          cache-directories: ~/AppData/Local/ort.pyke.io

      - name: Create sidecar + DLL placeholders
        # tauri.conf.json declares an externalBin (sidecar) whose path the
        # Tauri build script validates before linking; on Windows it resolves
        # to the msvc-triple-suffixed .exe. tauri.windows.conf.json
        # additionally declares a `binaries/*.dll` resources glob (the Dawn
        # runtime set), and tauri-build HARD-FAILS on a glob that matches
        # zero files — release builds stage the real DLLs, this leg only
        # needs the glob to match. Mirrors the macOS leg's framework-dylib
        # placeholder.
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          touch apps/desktop/src-tauri/binaries/yapstack-transcription-sidecar-x86_64-pc-windows-msvc.exe
          touch apps/desktop/src-tauri/binaries/webgpu_dawn.dll

      - name: Clippy
        run: cargo clippy --all -- -D warnings

      - name: Clippy (parakeet webgpu)
        # The default-feature clippy above does NOT compile the
        # `cfg(not(target_os = "macos"))` WebGPU arm in the parakeet engine.
        # Lint it explicitly so the non-macOS WebGPU codepath is actually
        # compiled + checked on the Windows leg.
        run: cargo clippy -p yapstack-transcription-sidecar --features webgpu -- -D warnings

      - name: Run tests
        # WASAPI COM tests are #[cfg_attr(target_os = "windows", ignore)], so
        # the crashing ones don't run here.
        # /FORCE:MULTIPLE: the vendored cr-sqlite no_std bundle (crsql_bundle)
        # defines its own `rust_eh_personality`, which collides with libstd's on
        # the MSVC linker in yapstack-sync's test binaries (same as release.yml).
        run: cargo test --all
        env:
          RUSTFLAGS: "-Clink-arg=/FORCE:MULTIPLE"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 24: db-runtime-schema.test.ts imports node:sqlite, which Node 22's
          # Vite can't resolve as a built-in.
          node-version: 24

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10.28.2 --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm --filter @yapstack/desktop lint

      - name: Type check
        run: pnpm --filter @yapstack/desktop typecheck

      - name: Test
        run: pnpm --filter @yapstack/desktop test
