[workspace]
resolver = "2"
members = [
    "crates/yapstack-common",
    "crates/yapstack-audio",
    "crates/yapstack-transcription",
    "crates/yapstack-transcription-sidecar",
    "crates/yapstack-crypto",
    "crates/yapstack-entitlements",
    "crates/yapstack-server",
    "crates/yapstack-sync",
    "apps/desktop/src-tauri",
]

# Vendored cr-sqlite (pinned v0.16.3) keeps its own MIT/Apache license and its own
# pinned nightly toolchain; it is built standalone by yapstack-sync/build.rs and must
# NOT be pulled into this workspace's stable-toolchain graph.
exclude = ["vendor/cr-sqlite"]

[workspace.package]
license = "AGPL-3.0-only"
repository = "https://github.com/hookr-dev/YapStack"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"

# The MP3 encode when a recording stops runs LAME (C, built by mp3lame-sys at
# that package's opt-level) fed by hound's WAV reader. At the dev profile's
# opt-level 0 a 5.6 h recording took 6.4 min to encode (1 min in release);
# optimizing these two packages brings `tauri dev` down to about 2 min.
[profile.dev.package.mp3lame-sys]
opt-level = 3

[profile.dev.package.hound]
opt-level = 3

[workspace.dependencies]
cpal = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
hound = "3.5"
tempfile = "3"
reqwest = { version = "0.12", features = ["stream"] }
sha2 = "0.11"
futures-util = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rubato = "0.16"
mp3lame-encoder = "0.2"
# --- sync backend (yapstack-server / -entitlements) ---
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
jsonwebtoken = "9"
base64 = "0.22"
rand = "0.8"
toml = "0.8"
async-trait = "0.1"
hmac = "0.13"
hex = "0.4"
