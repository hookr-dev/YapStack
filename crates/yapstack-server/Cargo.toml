# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "yapstack-server"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "YapStack blind relay (World B): a store-and-fan-out server that sees only ciphertext. Auth per CRYPTO_SPEC §3, RLS metadata isolation, and the entitlements seam wiring. It never runs the CRDT engine, never decrypts, and makes zero outbound calls."

[[bin]]
name = "yapstack-server"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
yapstack-crypto = { path = "../yapstack-crypto" }
yapstack-entitlements = { path = "../yapstack-entitlements" }
axum = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ed25519-dalek = "2"
