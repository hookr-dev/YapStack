# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "yapstack-crypto"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "RustCrypto implementation of the YapStack CRYPTO_SPEC (World B). Shared by the relay and the desktop sync runtime; the single source of truth for the Rust side of the two-stack crypto parity."

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = { workspace = true }
ed25519-dalek = "2"
subtle = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = { workspace = true }

[dev-dependencies]
hex = "0.4"
