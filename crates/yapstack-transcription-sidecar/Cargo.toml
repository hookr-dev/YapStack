[package]
name = "yapstack-transcription-sidecar"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true

[features]
default = ["whisper", "parakeet"]
whisper = ["dep:whisper-rs"]
metal = ["whisper-rs/metal"]
# Sortformer (speaker diarization) ships under the same parakeet feature
# so it travels with the engine that needs it.
parakeet = ["dep:parakeet-rs"]
# Apple-only CoreML execution provider for Parakeet. Strict superset of
# `parakeet`. Adds ~Metal/ANE acceleration via ort-coreml; CPU is kept as
# automatic fallback by parakeet-rs (`error_on_failure()`).
coreml = ["parakeet", "parakeet-rs/coreml"]
# WebGPU execution provider for Parakeet (Metal under the hood on macOS,
# Vulkan/Dawn elsewhere). Different ORT codepath than CoreML — doesn't
# go through the cache-write step that fails on models with external
# `.onnx.data` initializers. Pulls a direct `ort` dep (same pinned version
# parakeet-rs uses) so the strict opt-in path can register the EP itself
# with error_on_failure — parakeet-rs's own arm registers it soft.
webgpu = ["parakeet", "parakeet-rs/webgpu", "dep:ort"]

[dependencies]
yapstack-common = { path = "../yapstack-common" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hound = { workspace = true }
whisper-rs = { version = "0.16", optional = true }
parakeet-rs = { version = "=0.3.5", optional = true, features = ["sortformer"] }
# Must stay version-pinned to what parakeet-rs pins, or the SessionBuilder
# types passed through with_custom_configure won't unify. Feature-light on
# purpose: the ort features we need (webgpu) arrive via feature unification
# from parakeet-rs/webgpu.
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false }
