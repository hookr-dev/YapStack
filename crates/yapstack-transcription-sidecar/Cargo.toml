[package]
name = "yapstack-transcription-sidecar"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true

[features]
default = ["parakeet"]
# Sortformer (speaker diarization) ships under the same parakeet feature
# so it travels with the engine that needs it.
# `ort` comes in directly (same pin parakeet-rs uses) so the sidecar can
# configure sessions itself: strict EP registration and the opt-in
# YAPSTACK_ORT_PLACEMENT session logger.
parakeet = ["dep:parakeet-rs", "dep:ort"]
# WebGPU execution provider for Parakeet (Metal under the hood on macOS,
# Vulkan/Dawn elsewhere). The sidecar registers the EP itself through the
# direct `ort` dep with error_on_failure — parakeet-rs's own arm registers
# it soft.
webgpu = ["parakeet", "parakeet-rs/webgpu"]
# Parakeet TDT v3 on CoreML / the Neural Engine through FluidAudio (ADR 0008),
# for a model folder of compiled `.mlmodelc` bundles. Apple silicon only:
# build.rs builds and statically links swift/YapFluidAudio (needs Swift 6.2+,
# i.e. Xcode 26) and is a no-op on other targets. macOS 14+.
fluidaudio = ["parakeet"]

[dependencies]
yapstack-common = { path = "../yapstack-common" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hound = { workspace = true }
parakeet-rs = { version = "=0.3.5", optional = true, features = ["sortformer"] }
# Must stay version-pinned to what parakeet-rs pins, or the SessionBuilder
# types passed through with_custom_configure won't unify. Feature-light on
# purpose: the ort features we need (webgpu) arrive via feature unification
# from parakeet-rs/webgpu.
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false }

# Physical core count for the Parakeet ORT intra-op thread default (engines/cpu_cores.rs).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_SystemInformation"] }
